{%extends 'html/home.html'%}

{% load static %}

{%block home%}

<div class="container mt-4">
    
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
            <h5>Editar Publicação</h5>
        </div>
        <div class="card-body">
            <form method="post" action="{% url 'edit_post' hash=inst_hash id=id %}" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="titulo_new" class="form-label">Título:</label>
                    <input type="text" id="titulo_new" name="titulo_new" value="{{ pub_inf0.titulo }}" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label for="status" class="form-label">Ativo:</label>
                    <select id="status" name="status" class="form-select">
                        <option value="1">Sim</option>
                        <option value="0">Não</option>
                    </select>
                </div>
                
                <div id="img_files" class="mb-3 row g-3">
                    {% for url_img in pub_file %}
                        <div class="col-md-4 position-relative">
                            <div class="card border-0 shadow-sm">
                                <img src="{{ url_img.url }}" alt="Imagem" class="card-img-top rounded img-thumbnail">
                                <div class="card-body p-2 text-center">
                                    <input type="hidden" name="file_old_{{ forloop.counter }}" value="{{ url_img }}">
                                    <input type="file" class="form-control file-input" data-index="{{ forloop.counter }}">
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Editar</button>
            </form>
        </div>
    </div>
</div>

<style>
    .card {
        border-radius: 10px;
    }
    .card-img-top {
        height: 200px;
        object-fit: cover;
    }
</style>
    <script>
        document.querySelectorAll('#img_files input')[1].addEventListener('change', function(){
            document.querySelectorAll('#img_files input')[0].name='file01'
            document.querySelectorAll('#img_files input')[1].name='file0'
            document.querySelectorAll('#img_files img')[0].src=`${'{%static "image/logo_img.svg"%}'}`
        })
        document.querySelectorAll('#img_files input')[3].addEventListener('change', function(){
            document.querySelectorAll('#img_files input')[2].name='file02'
            document.querySelectorAll('#img_files input')[3].name='file1'
            document.querySelectorAll('#img_files img')[1].src=`${'{%static "image/logo_img.svg"%}'}`
        })
        document.querySelectorAll('#img_files input')[5].addEventListener('change', function(){
            document.querySelectorAll('#img_files input')[4].name='file03'
            document.querySelectorAll('#img_files input')[5].name='file2'
            document.querySelectorAll('#img_files img')[2].src=`${'{%static "image/logo_img.svg"%}'}`
        })
        document.querySelectorAll('#img_files input')[7].addEventListener('change', function(){
            document.querySelectorAll('#img_files input')[6].name='file04'
            document.querySelectorAll('#img_files input')[7].name='file3'
            document.querySelectorAll('#img_files img')[3].src=`${'{%static "image/logo_img.svg"%}'}`
        })
        document.querySelectorAll('#img_files input')[9].addEventListener('change', function(){
            document.querySelectorAll('#img_files input')[8].name='file05'
            document.querySelectorAll('#img_files input')[9].name='file4'
            document.querySelectorAll('#img_files img')[4].src=`${'{%static "image/logo_img.svg"%}'}`
        })
    </script>
</form>
{%endblock%}
